[pytest]
testpaths = tests
markers =
    pg: PostgreSQL-backed business/data-path tests (storeye_test via TEST_DATABASE_URL)
    legacy_sqlite: tests for the legacy SQLite/SQLModel diagnostics stack (app.core.database + /api/health, /api/ready, /api/metrics)
    no_db: pure unit tests that require no database
    real_ai: real-model smoke test that loads local YOLO/OCR weights (slow; opt-in)filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning